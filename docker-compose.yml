# One-command install:  docker compose up -d        (add --profile redis for the optional Redis)
name: dor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dor}
      POSTGRES_DB: ${POSTGRES_DB:-dor}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed on localhost only (for dev tools and tests). Remove in production.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dor} -d ${POSTGRES_DB:-dor}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  app:
    build: .
    image: dor-queue:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dor}:${POSTGRES_PASSWORD:-dor}@db:5432/${POSTGRES_DB:-dor}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Development defaults so `docker compose up` works on a clean machine. SET REAL VALUES IN .env.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-ZG9yLWRldi1vbmx5LWtleS1jaGFuZ2UtbWUtcGxlYXM=}
      PHONE_HASH_KEY: ${PHONE_HASH_KEY:-dor-dev-only-phone-hash-key}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
