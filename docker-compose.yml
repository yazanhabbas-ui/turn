# Dor (دور) queue system.
#
#   Trial / development :  docker compose up -d                       (built-in demo keys, demo data)
#   Production          :  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#                          (or put COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env)
#   Optional Redis      :  add  --profile redis  and set REDIS_URL=redis://redis:6379 (only for several app nodes)
#
# The database is NOT published on the host. `docker-compose.override.yml` (loaded automatically by plain
# `docker compose`, and deliberately NOT by the production command above) publishes it on 127.0.0.1:5432 for
# development tools and tests.
name: dor

x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dor}
      POSTGRES_DB: ${POSTGRES_DB:-dor}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dor} -d ${POSTGRES_DB:-dor}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    logging: *logging

  app:
    build: .
    image: dor-queue:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dor}:${POSTGRES_PASSWORD:-dor}@db:5432/${POSTGRES_DB:-dor}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Development defaults so `docker compose up` works on a clean machine. The production override requires real values.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-ZG9yLWRldi1vbmx5LWtleS1jaGFuZ2UtbWUtcGxlYXM=}
      PHONE_HASH_KEY: ${PHONE_HASH_KEY:-dor-dev-only-phone-hash-key}
      SEED_DEMO: ${SEED_DEMO:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Set APP_BIND=127.0.0.1 when a reverse proxy on the same machine terminates TLS (docs/deployment.md).
      - "${APP_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    volumes:
      # Read-only view of the backup folder: lets Admin -> Overview show "last backup" (backups/last-success.json).
      - ${BACKUP_DIR:-./backups}:/app/backups:ro
    stop_grace_period: 30s
    logging: *logging

volumes:
  pgdata:
