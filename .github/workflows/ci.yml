name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dor
          POSTGRES_PASSWORD: dor
          POSTGRES_DB: dor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dor" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://dor:dor@localhost:5432/dor_test
      TEST_DATABASE_URL: postgres://dor:dor@localhost:5432/dor_test
      APP_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      PHONE_HASH_KEY: ci-phone-hash-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
